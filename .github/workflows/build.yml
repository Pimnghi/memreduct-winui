name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-2025
          - platform: ARM64
            runner: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build and validate
        shell: pwsh
        run: .\build-publish.ps1 -Platform "${{ matrix.platform }}"
